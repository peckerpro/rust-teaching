[workspace]
members = [
    "crates/common",
    "crates/lexer",
    "crates/parser",
    "crates/ast",
    "crates/semantic",
    "crates/codegen",
    "crates/driver",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Common
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ariadne = "0.4"                 # 漂亮的错误报告(带颜色和区位指示)

# Serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Web (services)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# LLVM
inkwell = { version = "0.5", features = ["llvm18-0"] }

# Utils
parking_lot = "0.12"
once_cell = "1"
dashmap = "6"
rayon = "1"
